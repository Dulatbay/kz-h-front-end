name: Frontend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build . -t ${{ secrets.DOCKER_USERNAME }}/kzh-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/kzh-frontend:latest

  deploy:
      - name: Deploy to Server using SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd kzh
            echo "Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/kzh-frontend:latest


            echo "Stopping and removing old containers..."
            docker-compose stop frontend
            docker-compose rm -f frontend

            echo "Starting up containers with Docker Compose..."
            docker-compose up -d frontend

            echo "Deployment completed!"
